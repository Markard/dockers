services:
  pg:
    build: ./docker/pg
    hostname: pg
    container_name: pg
    environment:
      POSTGRES_DB: db_name
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - $PWD/docker/pg/init.d:/docker-entrypoint-initdb.d
      - $PWD/docker/pg/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d db_name" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    command: -c "config_file=/etc/postgresql/postgresql.conf"

  ch:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    hostname: ch
    container_name: ch
    environment:
      - CLICKHOUSE_DB=db_name
      - CLICKHOUSE_USER=user
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=pass
    volumes:
      - $PWD/docker/ch/init.d:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/?query=SELECT%201 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------
  kafka-1:
    image: apache/kafka:${KAFKA_VERSION}
    hostname: kafka-1
    container_name: kafka-1
    environment:
      # Configure listeners for both docker and host communication
      KAFKA_LISTENERS: 'CONTROLLER://:9091,HOST://:9092,INTER://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'INTER://kafka-1:19092,HOST://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTER:PLAINTEXT,HOST:PLAINTEXT'

      # Settings required for KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091

      # Listener to use for broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    expose:
      - "19092"
    ports:
      - "29092:9092"
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9091; exit $$?;'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

  kafka-ui:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION}
    hostname: kafka-ui
    container_name: kafka-ui
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
    volumes:
      - ./docker/kafka-ui/config.yaml:/etc/kafkaui/dynamic_config.yaml
    ports:
      - "8080:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider localhost:8080 || exit 1
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

  #    schema_registry:
  #        image: confluentinc/cp-schema-registry:${CP_SCHEMA_REGISTRY_VERSION}
  #        hostname: schema_registry
  #        container_name: schema_registry
  #        environment:
  #            SCHEMA_REGISTRY_HOST_NAME: schema_registry
  #            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:19092
  #            SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8085"
  #        ports:
  #            - "8085:8085"
  #        depends_on:
  #            kafka-1:
  #                condition: service_healthy

  kafka-connect:
    image: confluentinc/cp-kafka-connect-base:${KAFKA_CONNECT_VERSION}
    hostname: kafka-connect
    container_name: kafka-connect
    ports:
      - "8083:8083"
    depends_on:
      kafka-1:
        condition: service_healthy
      pg:
        condition: service_started
      ch:
        condition: service_started
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka-1:19092"
      CONNECT_REST_PORT: "8083"
      CONNECT_GROUP_ID: kafka-connect
      CONNECT_CONFIG_STORAGE_TOPIC: kc_connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: kc_connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: kc_connect-status
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_LOG4J_APPENDER_STDOUT_LAYOUT_CONVERSIONPATTERN: "[%d] %p %X{connector.context}%m (%c:%L)%n"
      CONNECT_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      #  ---------------
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/data/plugins
    # If you want to use the Confluent Hub installer to d/l component, but make them available
    # when running this offline, spin up the stack once and then run :
    #   docker cp kafka-connect:/usr/share/confluent-hub-components ./data/plugins
    volumes:
      - $PWD/docker/kafka-connect/plugins:/data/plugins
    command:
      - bash
      - -c
      - |
        echo "Installing connector plugins"
        confluent-hub install --no-prompt debezium/debezium-connector-postgresql:latest
        echo "Launching Kafka Connect worker"
        /etc/confluent/docker/run &
        #
        sleep infinity